
name: GAME HACKER AI - Gerar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'game-hacker-ai.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    name: Compilar aplicativo Android
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto do GitHub
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android SDK 36
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Verificar arquivo ZIP
        run: |
          test -f game-hacker-ai.zip
          unzip -t game-hacker-ai.zip

      - name: Extrair projeto
        run: |
          mkdir -p projeto
          unzip -q game-hacker-ai.zip -d projeto

      - name: Localizar projeto Android
        run: |
          FILE=$(find projeto -type f \
            -name settings.gradle.kts -print -quit)

          if [ -z "$FILE" ]; then
            echo "Projeto Gradle não encontrado."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$FILE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          test -f "$PROJECT_DIR/build.gradle.kts"
          test -f "$PROJECT_DIR/app/build.gradle.kts"

          echo "Projeto encontrado em: $PROJECT_DIR"

      - name: Criar certificado de depuração
        run: |
          cd "$PROJECT_DIR"

          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Compilar APK
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon --stacktrace assembleDebug

      - name: Verificar APK gerado
        run: |
          mkdir -p dist

          APK=$(find "$PROJECT_DIR/app/build/outputs/apk/debug" \
            -type f -name '*.apk' -print -quit)

          if [ -z "$APK" ]; then
            echo "ERRO: APK não foi gerado."
            exit 1
          fi

          cp "$APK" dist/GAME-HACKER-AI-MASTER.apk
          ls -lh dist/

      - name: Disponibilizar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: GAME-HACKER-AI-MASTER-APK
          path: dist/GAME-HACKER-AI-MASTER.apk
          if-no-files-found: error
          retention-days: 14
          
