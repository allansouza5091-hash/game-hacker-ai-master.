
name: Gerar APK Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extrair ZIP
        run: unzip -q game-hacker-ai.zip -d projeto

      - name: Compilar aplicativo
        run: |
          FILE=$(find projeto -name gradlew -type f | head -n 1)
          if [ -z "$FILE" ]; then
            echo "Não foi encontrado Gradle no ZIP."
            exit 1
          fi
          cd "$(dirname "$FILE")"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: GAME-HACKER-AI-APK
          path: projeto/**/build/outputs/apk/debug/*.apk
          
