
name: GAME HACKER AI - BUILD APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Compilar Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar ferramentas Android
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "build-tools;36.0.0"

      - name: Extrair ZIP e localizar projeto
        run: |
          set -e

          test -f game-hacker-ai.zip

          mkdir projeto
          unzip -q game-hacker-ai.zip -d projeto

          FILE=$(find projeto -type f \
            \( -name settings.gradle \
            -o -name settings.gradle.kts \) \
            -print -quit)

          test -n "$FILE"

          DIR=$(dirname "$FILE")
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"

          echo "Projeto encontrado: $DIR"

      - name: Compilar APK
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cd "$PROJECT_DIR"

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug \
              --no-daemon --stacktrace --console=plain \
              2>&1 | tee "$GITHUB_WORKSPACE/build.log"
          else
            echo "ERRO: Gradle Wrapper não encontrado."
            exit 1
          fi

      - name: Gerar relatório de erros
        if: always()
        run: |
          mkdir -p diagnostico

          if [ -f build.log ]; then
            grep -niE \
              'What went wrong:|Caused by:|error:|Execution failed|Could not|Failed to' \
              build.log > diagnostico/erros.txt || true

            tail -n 150 build.log \
              > diagnostico/log-final.txt

            cp build.log diagnostico/
          else
            echo "Build não iniciou. Verifique as etapas anteriores." \
              > diagnostico/erros.txt
          fi

      - name: Localizar e copiar APK
        if: steps.build.outcome == 'success'
        run: |
          set -e
          mkdir -p dist

          APK=$(find "$PROJECT_DIR" -type f \
            -path '*/build/outputs/apk/*/*.apk' \
            -print -quit)

          test -n "$APK"
          cp "$APK" dist/GAME-HACKER-AI.apk

      - name: Disponibilizar APK
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: GAME-HACKER-AI-APK
          path: dist/*.apk

      - name: Disponibilizar diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GAME-HACKER-AI-DIAGNOSTICO
          path: diagnostico/

      - name: Resultado final
        if: always()
        run: |
          if [ "${{ steps.build.outcome }}" != "success" ]; then
            echo "ERRO: compilação não concluída."
            exit 1
          fi

          echo "APK compilado com sucesso!"
          
