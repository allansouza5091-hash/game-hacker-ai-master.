
name: GAME HACKER AI - APK MASTER

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Compilar aplicativo Android
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verificar ZIP
        run: |
          set -e
          test -f game-hacker-ai.zip
          unzip -t game-hacker-ai.zip

      - name: Extrair projeto
        run: |
          set -e
          mkdir -p projeto
          unzip -q game-hacker-ai.zip -d projeto
          echo "ZIP extraído com sucesso."

      - name: Localizar projeto Android
        id: localizar
        run: |
          set -e

          PROJECT_DIR=$(find projeto -type f \
            \( -name settings.gradle.kts \
            -o -name settings.gradle \) \
            -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ] || \
             [ ! -d "$PROJECT_DIR" ]; then
            echo "ERRO: Projeto Gradle não encontrado."
            find projeto -maxdepth 4 -type f
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Projeto localizado: $PROJECT_DIR"

      - name: Detectar versão Gradle
        id: versao
        run: |
          set -e

          FILE="$PROJECT_DIR/gradle/wrapper/gradle-wrapper.properties"
          VERSION="8.13"

          if [ -f "$FILE" ]; then
            DETECTED=$(grep 'distributionUrl=' "$FILE" \
              | grep -oE 'gradle-[0-9]+\.[0-9]+(\.[0-9]+)?' \
              | head -1 | sed 's/gradle-//')

            if [ -n "$DETECTED" ]; then
              VERSION="$DETECTED"
            fi
          fi

          echo "Gradle selecionado: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ steps.versao.outputs.version }}

      - name: Preparar Android SDK
        run: |
          set -e

          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"

          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then
            echo "ERRO: Android SDK não encontrado."
            exit 1
          fi

          SDKMANAGER=$(find "$SDK/cmdline-tools" \
            -name sdkmanager -type f 2>/dev/null | head -1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERRO: sdkmanager não encontrado."
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-34" \
            "platforms;android-35" \
            "platforms;android-36" \
            "build-tools;34.0.0" \
            "build-tools;35.0.0" \
            "build-tools;36.0.0"

          echo "Android SDK preparado."

      - name: Verificar estrutura Android
        run: |
          set -e

          echo "Pasta: $PROJECT_DIR"

          if [ ! -d "$PROJECT_DIR" ]; then
            echo "ERRO: Pasta do projeto não encontrada."
            exit 1
          fi

          cd "$PROJECT_DIR"

          if [ ! -f app/build.gradle.kts ] && \
             [ ! -f app/build.gradle ]; then
            echo "ERRO: Módulo app não encontrado."
            find . -maxdepth 4 -type f
            exit 1
          fi

          echo "Estrutura Android validada."

      - name: Compilar APK
        run: |
          set -o pipefail
          cd "$PROJECT_DIR"

          gradle --no-daemon \
            --stacktrace \
            assembleDebug 2>&1 \
            | tee "$GITHUB_WORKSPACE/build.log"

      - name: Verificar APK
        if: success()
        run: |
          set -e
          mkdir -p dist

          APK=$(find "$PROJECT_DIR" \
            -type f -path '*/build/outputs/apk/*/*.apk' \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERRO: APK não foi gerado."
            exit 1
          fi

          cp "$APK" dist/GAME-HACKER-AI.apk
          ls -lh dist/

      - name: Disponibilizar APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: GAME-HACKER-AI-MASTER
          path: dist/GAME-HACKER-AI.apk
          if-no-files-found: error
          retention-days: 14

      - name: Salvar relatório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RELATORIO-GAME-HACKER-AI
          path: build.log
          if-no-files-found: ignore
          retention-days: 14
          
